<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liturgia Diária</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">
        <div id="santo-do-dia" style="display: none;">
            <img id="santo-imagem" src="" alt="Santo do Dia">
            <h2 id="santo-nome"></h2>
        </div>
        <div id="liturgia-header">
            <h1 id="liturgia-titulo">Liturgia Diária</h1>
            <p id="liturgia-data"></p>
            <div id="liturgia-cor" class="cor-liturgica"></div>
        </div>

        <div id="leituras-grid">
            <!-- Blocos de leitura serão inseridos aqui -->
        </div>

        <div id="timeline-container">
            <!-- A linha do tempo será gerada aqui pelo JavaScript -->
        </div>
    </div>

    <div id="offcanvas-container" class="hidden">
        <div id="offcanvas-content">
            <button id="offcanvas-close">&times;</button>
            <div id="offcanvas-body"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
